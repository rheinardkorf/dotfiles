# gitmux: git status in the tmux bar (used by ~/.config/tmux/scripts/git-block.sh)
# Colours: catppuccin mocha. Docs: https://github.com/arl/gitmux#customizing
tmux:
  symbols:
    branch: ""
    ahead: "↑"
    behind: "↓"
    staged: "● "
    conflict: "✖ "
    modified: "✚ "
    untracked: "… "
    stashed: "⚑ "
    clean: "✔"
  styles:
    clear: "#[fg=#cdd6f4]"
    state: "#[fg=#f38ba8,bold]"
    branch: "#[fg=#cdd6f4,bold]"
    remote: "#[fg=#94e2d5]"
    divergence: "#[fg=#cdd6f4]"
    staged: "#[fg=#a6e3a1,bold]"
    conflict: "#[fg=#f38ba8,bold]"
    modified: "#[fg=#f9e2af,bold]"
    untracked: "#[fg=#cba6f7,bold]"
    stashed: "#[fg=#89b4fa,bold]"
    clean: "#[fg=#f5e0dc,bold]"
  layout: [branch, " ", divergence, flags]
  options:
    branch_max_len: 30
    hide_clean: false
