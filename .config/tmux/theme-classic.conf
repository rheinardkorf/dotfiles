# Classic bar: the original look (blue session name, plain window list).
# Loaded from tmux.conf; swap the source-file line there to change themes.
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=colour245"
set -g status-left-length 40
# Session name turns yellow while the prefix is armed
set -g status-left "#{?client_prefix,#[bg=colour3],#[bg=colour4]}#[fg=colour0,bold] #S #[default] "
# Right side: Claude agents waiting in other sessions, zoom flag, clock
set -g status-right-length 80
set -g status-right "#(~/.config/tmux/scripts/claude-waiting.sh '#{session_name}')#{?window_zoomed_flag,#[fg=colour3]ZOOM ,}"   # no clock: SketchyBar shows the time
# Window names get a Claude marker (set by Claude Code hooks, see scripts/claude-status.sh):
#   🔔 waiting for you    ✓ finished
setw -g window-status-format " #I #W#{?#{==:#{@claude},waiting},#[fg=colour3] 🔔,}#{?#{==:#{@claude},done},#[fg=colour2] ✓,} "
setw -g window-status-current-format "#[fg=colour255,bold] #I #W#{?#{==:#{@claude},waiting},#[fg=colour3] 🔔,}#{?#{==:#{@claude},done},#[fg=colour2] ✓,} "
setw -g window-status-separator ""
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour4"
set -g message-style "bg=colour4,fg=colour0"
set -g mode-style "bg=colour4,fg=colour0"
set -g popup-border-lines rounded
set -g popup-border-style "fg=colour4"

