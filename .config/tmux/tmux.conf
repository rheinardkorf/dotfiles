# ~/.config/tmux/tmux.conf
# Reload with: prefix r        Cheatsheet: prefix ?

# --- Prefix: Ctrl-Space ------------------------------------------------------
# Easier to reach than Ctrl-b and doesn't steal Ctrl-a (start of line) from zsh.
unbind C-b
set -g prefix C-Space
bind C-Space last-window          # tap prefix twice to flip between two windows

# --- General -----------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10            # no lag when pressing Esc in nvim
set -g focus-events on
set -g set-clipboard on           # OSC52: yanks inside tmux reach the macOS clipboard
set -g allow-passthrough on
set -g base-index 1               # windows start at 1 (matches the keyboard)
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off      # closing a session hops to another instead of dropping you out
set -g display-time 2000
set -g set-titles on
set -g set-titles-string "#S / #W"

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# --- Sessions (one per project) ----------------------------------------------
bind f display-popup -E -w 80% -h 75% "sesh picker -i"
bind Tab run-shell "sesh last"    # jump back to the previous session
# Promote: move the current window into its own session (e.g. unleash/fix-auth)
bind P run-shell "~/.config/tmux/scripts/promote-window.sh '#{client_tty}' '#{session_name}' '#{window_id}' '#{window_name}' '#{pane_current_path}' '#{session_windows}'"
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# --- Windows & panes ---------------------------------------------------------
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Floating scratch shell in the current directory (prefix ` again or exit to close)
bind ` display-popup -E -d "#{pane_current_path}" -w 80% -h 75%

# Help
bind ? display-popup -E -w 80% -h 85% "less -R ~/.config/tmux/cheatsheet.md"
bind / list-keys

# --- Copy mode (vi keys) -----------------------------------------------------
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# --- Look ---------------------------------------------------------------------
# The bar's look lives in a theme file; change this line to switch:
#   theme-catppuccin.conf   catppuccin (themes/catppuccin)
#   theme-classic.conf      the original plain bar
set -g status-position top
set -g status-interval 5
set -g popup-border-lines rounded
# A second status line under the bar, drawn as a dim hairline: separates the bar
# from pane output and adds a little breathing room
set -g status 2
set -g status-format[1] "#[align=left,fg=colour238]#{R:─,#{client_width}}"
source-file ~/.config/tmux/theme-catppuccin.conf

# --- Plugins (TPM) -----------------------------------------------------------
# prefix I = install, prefix U = update
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # prefix C-s save / C-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save every 15m, auto-restore on start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
# Restored layouts keep their saved size; re-fit them to the actual windows
set -g @resurrect-hook-post-restore-all '~/.config/tmux/scripts/fit-layouts.sh'

run '~/.config/tmux/plugins/tpm/tpm'
