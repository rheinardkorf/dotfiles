# Catppuccin bar (https://github.com/catppuccin/tmux, v2.3.1 in themes/catppuccin).
# Loaded from tmux.conf; swap the source-file line there to change themes.
# Options: docs in themes/catppuccin/docs/reference/
# Not in dotfiles; on a new machine install it with:
#   git clone -b v2.3.1 --depth 1 https://github.com/catppuccin/tmux.git ~/.config/tmux/themes/catppuccin
# Also needs gitmux (brew install gitmux) for the git block.
#
# Layout: windows as plain text (no pills); square information blocks:
#   [session]  1 jarvis  2 server ✓        [🔔 waiting] [git]

# Catppuccin only sets these if they're unset, so a reload would keep old
# values after changing styles. Clear them so changes apply on reload.
set -gu @catppuccin_window_left_separator
set -gu @catppuccin_window_middle_separator
set -gu @catppuccin_window_right_separator
set -gu @catppuccin_window_current_left_separator
set -gu @catppuccin_window_current_middle_separator
set -gu @catppuccin_window_current_right_separator

set -g @catppuccin_flavor "mocha"               # latte, frappe, macchiato, mocha
set -g @catppuccin_window_status_style "none"   # windows are styled below instead
set -g @catppuccin_status_background "#1e1e2e"  # Mocha base = Kitty's background, so the bar blends in

# Square blocks (catppuccin's default left edge is rounded)
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator "█"

# Session block turns yellow while the prefix is armed (catppuccin's default is red)
set -g @catppuccin_session_color "#{?client_prefix,#{E:@thm_yellow},#{E:@thm_green}}"

run ~/.config/tmux/themes/catppuccin/catppuccin.tmux

# --- Everything below needs the palette (@thm_*) the run line above defines ---

# Windows: plain text. Current one bold mauve, others dim. Claude markers from
# scripts/claude-status.sh:  🔔 waiting for you   ✓ finished
setw -g window-status-separator ""
setw -g window-status-format " #[fg=#{@thm_overlay_1}]#I #W#{?#{==:#{@claude},waiting},#[fg=#{@thm_yellow}] 🔔,}#{?#{==:#{@claude},done},#[fg=#{@thm_green}] ✓,} "
setw -g window-status-current-format " #[fg=#{@thm_mauve},bold]#I #W#{?#{==:#{@claude},waiting},#[fg=#{@thm_yellow}] 🔔,}#{?#{==:#{@claude},done},#[fg=#{@thm_green}] ✓,} "

set -g status-left-length 50
set -g status-left "#{E:@catppuccin_status_session} "

# Right: waiting Claudes (only when any), git (only in a repo).
# No clock (SketchyBar shows it) or folder (the shell prompt shows it).
set -g status-right-length 150
set -g status-right "#(~/.config/tmux/scripts/claude-waiting.sh '#{session_name}' block)"
set -ag status-right "#(~/.config/tmux/scripts/git-block.sh '#{pane_current_path}')"
set -ag status-right "#{?window_zoomed_flag,#[fg=#{@thm_yellow}]ZOOM ,}"
