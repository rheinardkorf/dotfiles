# ~/.config/kitty/kitty.conf
# Based on Ghostty config

# --- General -----------------------------------------------------------------
# font_family      Hack Nerd Font Mono
font_size        14
disable_ligatures always

# Focus
window_border_width 0

# Window
window_padding_width 6 2
macos_option_as_alt yes
macos_show_window_title_in menubar
hide_window_decorations titlebar-and-corners
macos_window_resizable no
window_border_width 0

# Startup
shell_integration enabled
shell_integration_features enabled

# --- Keybindings (Mac) -------------------------------------------------------
# Cmd+N: open sesh picker (prefix f)
map cmd+n send_text all \x00f

# Cmd+Shift+N: new OS window (separate window, not pane)
map cmd+shift+n new_os_window

# Cmd+T: new tmux window (prefix c)
map cmd+t send_text all \x00c

# Cmd+W: close pane (prefix x)
map cmd+w send_text all \x00x

# Cmd+D / Cmd+Shift+D: split horizontal/vertical (prefix | / prefix -)
map cmd+d send_text all \x00|
map cmd+shift+d send_text all \x00-

# Cmd+[ / Cmd+]: previous/next window (prefix p / prefix n)
map cmd+[ send_text all \x00p
map cmd+] send_text all \x00n

# Cmd+1..9: jump to window (prefix 1..9)
map cmd+1 send_text all \x001
map cmd+2 send_text all \x002
map cmd+3 send_text all \x003
map cmd+4 send_text all \x004
map cmd+5 send_text all \x005
map cmd+6 send_text all \x006
map cmd+7 send_text all \x007
map cmd+8 send_text all \x008
map cmd+9 send_text all \x009

# --- Theme ------------------------------------------------------------------
# Catppuccin mocha colors
foreground            #FFFFFF
background            #282c34
selection_foreground  #1E1E2E
selection_background  #F5E0DC
url_color             #89B4FA
cursor                #F5E0DC
cursor_text_color     #1E1E2E
color0                #45475A
color1                #F38BA8
color2                #A6E3A1
color3                #F9E2AF
color4                #89B4FA
color5                #F5C2E7
color6                #94E2D5
color7                #BAC2DE
color8                #585B70
color9                #F38BA8
color10               #A6E3A1
color11               #F9E2AF
color12               #89B4FA
color13               #F5C2E7
color14               #94E2D5
color15               #A6ADC8


# BEGIN_KITTY_FONTS
font_family      family='Hack Nerd Font Mono' style=Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS